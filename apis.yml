name: Simplifyber
description: >-
  Simplifyber is a sustainable footwear and materials technology company that
  manufactures shoe uppers and other components using a proprietary fiber-molding
  process. By casting products directly from a liquid, cellulose-based material it
  eliminates the spinning, weaving, and knitting steps and much of the cutting and
  sewing of traditional shoemaking, which it says lowers the CO2 emissions of a shoe
  upper by roughly 33x versus conventional methods. Its flagship Moon Shoe was
  developed with the fashion brand Ganni. Simplifyber is a Techstars-backed startup.
  It operates as a consumer and industrial manufacturer and does not currently
  publish a public developer API, documentation, or developer portal.
